    <style>
        /* ===== SPLASH SCREEN ===== */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            /* Subtle logo watermark in background */
            background-repeat: no-repeat;
            background-position: center 30%;
            background-size: 200px 200px;
        }

        /* Dark overlay to make watermark subtle */
        #splashScreen::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.82);
        }

        #splashScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-content {
            position: relative;
            /* above ::before overlay */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .splash-logo-img {
            width: 88px;
            height: 88px;
            margin-bottom: 18px;
        }

        .splash-title {
            color: #2c2c3e;
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .splash-subtitle {
            color: #888;
            font-size: 0.82rem;
            margin-top: 3px;
        }

        .splash-loader {
            margin-top: 32px;
            display: flex;
            gap: 7px;
        }

        .splash-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #696cff;
            opacity: 0.3;
            animation: splashBounce 1.2s infinite;
        }

        .splash-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .splash-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes splashPulse {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 8px 32px rgba(105, 108, 255, 0.22);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 12px 40px rgba(105, 108, 255, 0.35);
            }
        }

        @keyframes splashBounce {

            0%,
            100% {
                transform: translateY(0);
                opacity: 0.3;
            }

            50% {
                transform: translateY(-7px);
                opacity: 1;
            }
        }

        /* ===== PROGRESS LOADER ===== */
        .progress-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            z-index: 9999;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #696cff 0%, #5f61e6 50%, #696cff 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            transition: width 0.2s ease;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* ===== MATERIAL BOTTOM NAVIGATION — all screen sizes ===== */
        #bottomNav {
            display: block;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fffbff;
            border-top: none;
            box-shadow: 0 -1px 0 0 #e0e0e0, 0 -4px 16px rgba(0, 0, 0, 0.07);
            z-index: 1100;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        #bottomNav ul {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            height: 64px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        #bottomNav .nav-item {
            flex: 1;
        }

        #bottomNav .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 4px 0;
            color: #49454f;
            text-decoration: none;
            position: relative;
            transition: color 0.2s;
            gap: 2px;
        }

        #bottomNav .nav-link .nav-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #bottomNav .nav-link i {
            font-size: 1.3rem;
            transition: transform 0.2s;
        }

        #bottomNav .nav-link span {
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.03em;
        }

        /* Active state — top highlight bar + primary color */
        #bottomNav .nav-link.active {
            color: #696cff;
        }

        #bottomNav .nav-link.active::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 3px;

    <script>
        // Global Variables
        var currentUser = null;
        var isLoggedIn = false;
        var currentPageName = '';

        // Toast Configuration
        function showToast(type, title, message) {
            toastr.options = {
                closeButton: true,
                progressBar: true,
                positionClass: 'toast-top-right',
                newestOnTop: true,
                showEasing: 'swing',
                hideEasing: 'linear',
                showMethod: 'fadeIn',
                hideMethod: 'fadeOut',
                showDuration: 300,
                hideDuration: 800,
                timeOut: 3000,
                extendedTimeOut: 1000
            };
            toastr[type](message, title);
        }

        // Loading functions (kept for compatibility but no longer show overlay)
        function showLoading() { /* no-op */ }
        function hideLoading() { /* no-op */ }

        // Build clean URL from page string
        function buildCleanUrl(page) {
            var parts = page.split('&');
            var url = '/' + parts[0];
            if (parts.length > 1) url += '?' + parts.slice(1).join('&');
            return url;
        }

        // Page Loading Function (SPA Router)
        function loadPage(event, page, title, fromPopState) {
            if (event) event.preventDefault();

            var pageName = page.split('&')[0];
            var url = buildCleanUrl(page);

            var fetchUrl = 'pages/' + pageName + '.php';
            var params = page.split('&');
            if (params.length > 1) fetchUrl += '?' + params.slice(1).join('&');

            currentPageName = pageName;

            // Show progress bar
            var loader = document.querySelector('.progress-loader');
            var bar = document.querySelector('.progress-bar');
            loader.style.display = 'block';
            var progress = 0;

            var interval = setInterval(function () {
                if (progress < 85) {
                    progress += Math.random() * 20;
                    bar.style.width = Math.min(progress, 85) + '%';
                }
            }, 80);

            fetch(fetchUrl, {
                method: 'GET',
                credentials: 'same-origin',
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
                .then(function (res) { return res.text(); })
                .then(function (html) {
                    var $contentArea = $('#content-area');

                    // Close any open Bootstrap modals and clean up backdrops
                    document.querySelectorAll('.modal.show').forEach(function (m) {
                        var mi = bootstrap.Modal.getInstance(m);
                        if (mi) mi.hide();
                    });
                    document.querySelectorAll('.modal-backdrop').forEach(function (b) {
                        b.parentNode.removeChild(b);
                    });
                    document.body.classList.remove('modal-open');
                    document.body.style.removeProperty('overflow');
                    document.body.style.removeProperty('padding-right');

                    // Update browser URL BEFORE inserting content
                    if (!fromPopState) {
                        history.pushState({ page: page, title: title }, title, url);
                    }

                    // ---- Reliable script injection ----
                    // 1. Parse the HTML and pull out <script> blocks
                    var tmp = document.createElement('div');
                    tmp.innerHTML = html;
                    var scriptNodes = tmp.querySelectorAll('script');
                    var scriptTexts = [];
                    scriptNodes.forEach(function (s) {
                        if (!s.src) scriptTexts.push(s.textContent); // inline only
                        s.parentNode.removeChild(s);
                    });

                    // 2. Insert HTML (without scripts) so DOM is committed first
                    $contentArea.css('animation', 'none');
                    $contentArea[0].offsetHeight;
                    $contentArea.css('animation', 'fadeIn 0.2s ease-in-out');
                    $contentArea[0].innerHTML = tmp.innerHTML;

                    clearInterval(interval);
                    bar.style.width = '100%';
                    setTimeout(function () {
                        loader.style.display = 'none';
                        bar.style.width = '0%';
                    }, 250);

                    updateActiveMenu('register');
                    document.getElementById('page-title').textContent = (title || 'Home') + ' - %%SITE_NAME%%';
                    window.scrollTo({ top: 0, behavior: 'smooth' });

                    // 3. Execute scripts AFTER DOM is fully committed
                    //    Remove any previously injected page scripts first
                    document.querySelectorAll('script[data-spa-page]').forEach(function (s) {
                        s.parentNode.removeChild(s);
                    });
                    setTimeout(function () {
                        scriptTexts.forEach(function (code) {
                            if (!code.trim()) return;
                            var s = document.createElement('script');
                            s.setAttribute('data-spa-page', pageName);
                            s.textContent = code;
                            document.head.appendChild(s);
                        });
                    }, 0);
                })
                .catch(function (error) {
                    clearInterval(interval);
                    loader.style.display = 'none';
                    bar.style.width = '0%';
                    console.error('Load error:', error);
                    showToast('error', 'Error', 'Failed to load page. Please try again.');
                });
        }

        // Update Active Menu
        function updateActiveMenu(page) {
            var links = document.querySelectorAll('#bottomNav .nav-link');
            links.forEach(function (link) {
                link.classList.remove('active');
                if (link.getAttribute('data-page') === page) {
                    link.classList.add('active');
                }
            });
        }

        // Handle browser back/forward
        window.addEventListener('popstate', function (event) {
            if (event.state && event.state.page) {
                loadPage(null, event.state.page, event.state.title, true);
            }
        });


        // Handle visibility change (app resume)
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden && currentPageName) {
                // Silently refresh current page data by triggering a custom event
                var refreshEvent = new CustomEvent('appResumed');
                document.dispatchEvent(refreshEvent);
            }
        });

        // Logout Function
        function logout() {
            Swal.fire({
                title: 'Logout',
                text: 'Are you sure you want to logout?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#696cff',
                cancelButtonColor: '#8592a3',
                confirmButtonText: 'Yes, logout',
                cancelButtonText: 'Cancel'
            }).then(function (result) {
                if (result.isConfirmed) {
                    $.ajax({
                        url: 'handlers/auth.php',
                        type: 'POST',
                        dataType: 'json',
                        data: { action: 'logout' },
                        success: function (response) {
                            if (response.success) {
                                showToast('success', 'Success', 'Logged out successfully');
                                setTimeout(function () { window.location.href = '/login'; }, 500);
                            } else {
                                showToast('error', 'Error', response.message || 'Logout failed');
                            }
                        },
                        error: function () {
                            showToast('error', 'Error', 'An error occurred during logout');
                            setTimeout(function () { window.location.href = '/login'; }, 500);
                        }
                    });
                }
            });
        }

        // Reload current page content via AJAX (used by top-nav Refresh button)
        function reloadCurrentPage() {
            if (currentPageName) {
                loadPage(null, currentPageName, document.getElementById('page-title').textContent.split(' - ')[0], true);
            } else {
                loadPage(null, 'home', 'Home', true);
            }
        }

        // Real-time balance refresh
        function refreshBalance() {
            if (!isLoggedIn) return;
            $.ajax({
                url: 'handlers/user.php',
                type: 'GET',
                dataType: 'json',
                data: { action: 'get_user' },
                success: function (response) {
                    if (response.success && response.data) {
                        currentUser = response.data;
                        var navBal = document.getElementById('navBalance');
                        if (navBal) {
                            navBal.innerHTML = '<i class="ti ti-wallet me-1"></i>' + parseFloat(response.data.total_balance).toFixed(2) + ' BDT';
                        }
                    }
                },
                error: function () { /* silent fail */ }
            });
        }

        // Refresh balance every 30 seconds
        if (isLoggedIn) {
            setInterval(refreshBalance, 30000);
        }

        // ==================== CENTRALIZED EVENT HANDLERS ====================

        // Password Toggle (delegation)
        document.addEventListener('click', function (e) {
            if (e.target.closest('.toggle-password')) {
                var toggle = e.target.closest('.toggle-password');
                var targetId = toggle.getAttribute('data-target');
                var input = document.getElementById(targetId);
                var icon = toggle.querySelector('i');
                if (input) {
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.classList.remove('ti-eye-off');
                        icon.classList.add('ti-eye');
                    } else {
                        input.type = 'password';
                        icon.classList.remove('ti-eye');
                        icon.classList.add('ti-eye-off');
                    }
                }
            }
        });

        // Form Submit Handlers (delegation)
        document.addEventListener('submit', function (e) {
            // Login Form
            if (e.target.id === 'loginForm') {
                e.preventDefault();
                e.stopPropagation();

                var loginInput = document.getElementById('login_input').value.trim();
                var password = document.getElementById('login_password').value;
                var alertEl = document.getElementById('loginAlert');
                var btn = document.getElementById('loginBtn');

                if (!loginInput || !password) {
                    alertEl.className = 'alert alert-danger mb-3';
                    alertEl.textContent = 'Please fill in all fields';
                    alertEl.style.display = 'block';
                    return false;
                }

                alertEl.style.display = 'none';
                btn.disabled = true;
                btn.querySelector('.btn-text').textContent = 'Signing in...';
                btn.querySelector('.spinner-border').classList.remove('d-none');

                $.ajax({
                    url: 'handlers/auth.php',
                    type: 'POST',
                    dataType: 'json',
                    data: { action: 'login', login_input: loginInput, password: password },
                    success: function (response) {
                        btn.disabled = false;
                        btn.querySelector('.btn-text').textContent = 'Sign In';
                        btn.querySelector('.spinner-border').classList.add('d-none');
                        if (response.success) {
                            showToast('success', 'Welcome!', 'Login successful');
                            setTimeout(function () { window.location.href = '/home'; }, 500);
                        } else if (response.banned) {
                            Swal.fire({
                                icon: 'error',
                                title: '🚫 Account Banned',
                                html: '<p class="mb-2">Your account has been suspended.</p><div class="alert alert-danger text-start p-2"><strong>Reason:</strong><br>' + (response.ban_reason || 'No reason provided.') + '</div><p class="small text-muted">If you believe this is a mistake, please contact support.</p>',
                                confirmButtonColor: '#696cff',
                                confirmButtonText: 'OK'
                            });
                        } else {
                            alertEl.className = 'alert alert-danger mb-3';
                            alertEl.textContent = response.message || 'Login failed';
                            alertEl.style.display = 'block';
                        }
                    },
                    error: function () {
                        btn.disabled = false;
                        btn.querySelector('.btn-text').textContent = 'Sign In';
                        btn.querySelector('.spinner-border').classList.add('d-none');
                        alertEl.className = 'alert alert-danger mb-3';
                        alertEl.textContent = 'Connection error. Please try again.';
                        alertEl.style.display = 'block';
                    }
                });
                return false;
            }

            // Register Form
            if (e.target.id === 'registerForm') {
                e.preventDefault();
                e.stopPropagation();

                var firstName = document.getElementById('reg_first_name').value.trim();
                var lastName = document.getElementById('reg_last_name').value.trim();
                var username = document.getElementById('reg_username').value.trim();
                var email = document.getElementById('reg_email').value.trim();
                var mobile = document.getElementById('reg_mobile').value.trim();
                var password = document.getElementById('reg_password').value;
                var confirmPassword = document.getElementById('reg_confirm_password').value;
                var alertEl = document.getElementById('registerAlert');
                var btn = document.getElementById('registerBtn');

                if (!firstName || !username || !email || !mobile || !password || !confirmPassword) {
                    alertEl.className = 'alert alert-danger mb-3';
                    alertEl.textContent = 'Please fill in all required fields';
                    alertEl.style.display = 'block';
                    return false;
                }
                if (password !== confirmPassword) {
                    alertEl.className = 'alert alert-danger mb-3';
                    alertEl.textContent = 'Passwords do not match';
                    alertEl.style.display = 'block';
                    return false;
                }
                if (password.length < 6) {
                    alertEl.className = 'alert alert-danger mb-3';
                    alertEl.textContent = 'Password must be at least 6 characters';
                    alertEl.style.display = 'block';
                    return false;
                }
                if (!/^[a-zA-Z0-9_]+$/.test(username)) {
                    alertEl.className = 'alert alert-danger mb-3';
                    alertEl.textContent = 'Username can only contain letters, numbers, and underscores';
                    alertEl.style.display = 'block';
                    return false;
                }

                alertEl.style.display = 'none';
                btn.disabled = true;
                btn.querySelector('.btn-text').textContent = 'Creating account...';
                btn.querySelector('.spinner-border').classList.remove('d-none');

                $.ajax({
                    url: '/api/auth/register', type: 'POST', contentType: 'application/json', dataType: 'json', data: JSON.stringify({ first_name: firstName, last_name: lastName, username: username, email: email, mobile: mobile, password: password, confirm_password: confirmPassword }),
                    success: function (response) {
                        if (response.success) {
                            showToast('success', 'Welcome!', 'Account created successfully');
                            setTimeout(function () { window.location.href = '/home'; }, 500);
                        } else {
                            alertEl.className = 'alert alert-danger mb-3';
                            alertEl.textContent = response.message || 'Registration failed';
                            alertEl.style.display = 'block';
                            btn.disabled = false;
                            btn.querySelector('.btn-text').textContent = 'Create Account';
                            btn.querySelector('.spinner-border').classList.add('d-none');
                        }
                    },
                    error: function () {
                        alertEl.className = 'alert alert-danger mb-3';
                        alertEl.textContent = 'Connection error. Please try again.';
                        alertEl.style.display = 'block';
                        btn.disabled = false;
                        btn.querySelector('.btn-text').textContent = 'Create Account';
                        btn.querySelector('.spinner-border').classList.add('d-none');
                    }
                });
                return false;
            }

            // Forgot Password Form
            if (e.target.id === 'forgotForm') {
                e.preventDefault();
                e.stopPropagation();

                var email = document.getElementById('forgot_email').value.trim();
                var alertEl = document.getElementById('forgotAlert');
                var btn = document.getElementById('forgotBtn');

                if (!email) {
                    alertEl.className = 'alert alert-danger mb-3';
                    alertEl.textContent = 'Please enter your email address';
                    alertEl.style.display = 'block';
                    return false;
                }

                alertEl.style.display = 'none';
                btn.disabled = true;
                btn.querySelector('.btn-text').textContent = 'Sending...';
                btn.querySelector('.spinner-border').classList.remove('d-none');

                $.ajax({
                    url: 'handlers/auth.php',
                    type: 'POST',
                    dataType: 'json',
                    data: { action: 'forgot_password', email: email },
                    success: function (response) {
                        btn.disabled = false;
                        btn.querySelector('.btn-text').textContent = 'Send Verification Code';
                        btn.querySelector('.spinner-border').classList.add('d-none');

                        if (response.success) {
                            document.getElementById('reset_email').value = email;
                            document.getElementById('step1').style.display = 'none';
                            document.getElementById('step2').style.display = 'block';
                            showToast('success', 'Code Sent', 'Please check your email for the verification code');
                        } else {
                            alertEl.className = 'alert alert-danger mb-3';
                            alertEl.textContent = response.message;
                            alertEl.style.display = 'block';
                        }
                    },
                    error: function () {
                        btn.disabled = false;
                        btn.querySelector('.btn-text').textContent = 'Send Verification Code';
                        btn.querySelector('.spinner-border').classList.add('d-none');
                        alertEl.className = 'alert alert-danger mb-3';
                        alertEl.textContent = 'Connection error. Please try again.';
                        alertEl.style.display = 'block';
                    }
                });
                return false;
            }

            // Reset Password Form
            if (e.target.id === 'resetForm') {
                e.preventDefault();
                e.stopPropagation();

                var email = document.getElementById('reset_email').value;
                var code = document.getElementById('reset_code').value.trim();
                var newPassword = document.getElementById('reset_new_password').value;
                var confirmPassword = document.getElementById('reset_confirm_password').value;
                var alertEl = document.getElementById('resetAlert');
                var btn = document.getElementById('resetBtn');

                if (!code || !newPassword || !confirmPassword) {
                    alertEl.className = 'alert alert-danger mb-3';
                    alertEl.textContent = 'Please fill in all fields';
                    alertEl.style.display = 'block';
                    return false;
                }
                if (newPassword.length < 6) {
                    alertEl.className = 'alert alert-danger mb-3';
                    alertEl.textContent = 'Password must be at least 6 characters';
                    alertEl.style.display = 'block';
                    return false;
                }
                if (newPassword !== confirmPassword) {
                    alertEl.className = 'alert alert-danger mb-3';
                    alertEl.textContent = 'Passwords do not match';
                    alertEl.style.display = 'block';
                    return false;
                }

                alertEl.style.display = 'none';
                btn.disabled = true;
                btn.querySelector('.btn-text').textContent = 'Resetting...';
                btn.querySelector('.spinner-border').classList.remove('d-none');

                $.ajax({
                    url: 'handlers/auth.php',
                    type: 'POST',
                    dataType: 'json',
                    data: { action: 'reset_password', email: email, reset_code: code, new_password: newPassword },
                    success: function (response) {
                        btn.disabled = false;
                        btn.querySelector('.btn-text').textContent = 'Reset Password';
                        btn.querySelector('.spinner-border').classList.add('d-none');

                        if (response.success) {
                            Swal.fire({
                                icon: 'success',
                                title: 'Password Reset!',
                                text: response.message,
                                confirmButtonColor: '#696cff',
                                confirmButtonText: 'Go to Login'
                            }).then(function () { loadPage(null, 'login', 'Login'); });
                        } else {
                            alertEl.className = 'alert alert-danger mb-3';
                            alertEl.textContent = response.message;
                            alertEl.style.display = 'block';
                        }
                    },
                    error: function () {
                        btn.disabled = false;
                        btn.querySelector('.btn-text').textContent = 'Reset Password';
                        btn.querySelector('.spinner-border').classList.add('d-none');
                        alertEl.className = 'alert alert-danger mb-3';
                        alertEl.textContent = 'Connection error. Please try again.';
                        alertEl.style.display = 'block';
                    }
                });
                return false;
            }
        });

        // Photo upload handlers (delegation)
        document.addEventListener('change', function (e) {
            if (e.target.id === 'quickPhotoInput') {
                var file = e.target.files[0];
                if (!file) return;
                if (file.size > 5 * 1024 * 1024) {
                    showToast('error', 'Error', 'File size must be less than 5MB');
                    return;
                }
                var formData = new FormData();
                formData.append('action', 'update_photo');
                formData.append('photo', file);
                $.ajax({
                    url: 'handlers/user.php', type: 'POST', data: formData,
                    processData: false, contentType: false, dataType: 'json',
                    success: function (response) {
                        if (response.success) {
                            document.getElementById('profileImage').src = response.photo_url + '?t=' + Date.now();
                            showToast('success', 'Success', 'Photo updated successfully');
                        } else {
                            showToast('error', 'Error', response.message || 'Failed to upload photo');
                        }
                    },
                    error: function () { showToast('error', 'Error', 'Failed to upload photo'); }
                });
            }

            if (e.target.id === 'photoInput') {
                var file = e.target.files[0];
                if (file) {
                    if (file.size > 5 * 1024 * 1024) {
                        showToast('error', 'Error', 'File size must be less than 5MB');
                        e.target.value = '';
                        return;
                    }
                    var reader = new FileReader();
                    reader.onload = function (ev) { document.getElementById('previewImage').src = ev.target.result; };
                    reader.readAsDataURL(file);
                }
            }
        });

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function () {

            
        if (typeof _banReason !== 'undefined' && _banReason) {
            Swal.fire({
                icon: 'error', title: '🚫 Account Banned',
                html: '<p class="mb-2">Your account has been suspended and you have been logged out.</p><div class="alert alert-danger text-start p-2"><strong>Reason:</strong><br>' + _banReason + '</div><p class="small text-muted">If you believe this is a mistake, please contact support.</p>',
                confirmButtonColor: '#696cff', confirmButtonText: 'OK'
            });
        }
    
        });
    </script>
